[tool.pyright]
include = ["."]
# 独立工具和工程归档不在网站仓库内；本机产物目录可能是目录连接。
exclude = [
    "**/__pycache__",
    ".venv",
    "**/node_modules",
    "backups",
    ".backups",
    "instance",
    "temp",
    "output",
    "logs",
    ".claude",
]
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false

[tool.ruff]
line-length = 100
target-version = "py312"
# 本机运行文件和独立开发脚本不参与应用代码检查。
exclude = [
    ".venv",
    "**/node_modules",
    "backups",
    ".backups",
    "instance",
    "temp",
    "output",
    "logs",
    ".claude/scripts",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
