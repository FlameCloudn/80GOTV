name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: python -m unittest discover -s tests -t . -p 'test_*.py'
        env:
          FLASK_ENV: testing
          DATABASE_PATH: ${{ runner.temp }}/80gotv-test.db
          SECRET_KEY: test-only-secret-not-for-production
      - run: bash -n deploy/*.sh
      - run: python scripts/build_frontend_images.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          FLASK_ENV: testing
          SECRET_KEY: browser-test-secret-not-for-production
