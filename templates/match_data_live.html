<style>
  .data-live{--ct:#68a8e8;--ct-deep:#17395e;--t:#e9bb55;--t-deep:#58441b;--live-text:#f7f9fb;--live-muted:#aeb8c2;--live-bg:#111820;--live-panel:#10151b;--live-panel-2:#1b222a;--live-row:rgba(255,255,255,.018);--live-row-line:rgba(255,255,255,.05);--live-line:rgba(255,255,255,.1);--radar-bg:#3b4853;--radar-brightness:1.9;margin:0 0 var(--space-lg);padding:14px;color:var(--live-text);background:var(--live-bg);border-radius:0;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .data-live .live-heading h2{font-size:17px;margin:0;font-weight:700;letter-spacing:0;color:var(--live-text)}
  .data-live .source-badge{padding:4px 8px;border-radius:0;background:#3b2d14;color:#ffd782;font-size:11px}
  .data-live .source-badge.online{background:#153d2a;color:#7fe2a8}
  .data-live .live-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
  .data-live .scoreboard,.data-live .radar-panel{background:var(--live-panel);border:1px solid var(--live-line);border-radius:0;overflow:hidden}
  .data-live .score-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:76px;padding:0 18px;background:var(--live-panel);border-bottom:1px solid var(--live-line)}
  .data-live .score-side{display:flex;align-items:center;gap:10px;min-width:0}
  .data-live .score-side.right{justify-content:flex-end;text-align:right}
  .data-live .side-tag{display:inline-flex;align-items:center;justify-content:center;width:28px;height:22px;border-radius:0;font-size:11px;font-weight:800}
  .data-live .side-tag.ct{background:var(--ct-deep);color:var(--ct)}.data-live .side-tag.t{background:var(--t-deep);color:var(--t)}
  .data-live .team-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .data-live .score-center{text-align:center;padding:0 18px}.data-live .score{font-size:38px;font-weight:800;line-height:1}
  .data-live .match-meta{font-size:11px;color:var(--live-muted);margin-top:5px}.data-live .timer{color:var(--live-text);font-weight:700}
  .data-live .round-strip{display:flex;gap:7px;align-items:center;min-height:34px;padding:6px 10px;background:var(--live-bg);border-top:1px solid var(--live-line);border-bottom:1px solid var(--live-line);overflow-x:auto}
  .data-live .round-result{display:block;width:16px;height:16px;object-fit:contain;flex:0 0 16px}
  .data-live .round-empty{font-size:11px;color:#77818c}
  .data-live .team-block+.team-block{border-top:1px solid var(--live-line)}
  .data-live .team-bar,.data-live .player-row{display:grid;grid-template-columns:minmax(125px,1fr) 54px 58px 68px 45px 48px 36px 36px 36px 46px;align-items:center;column-gap:5px}
  .data-live .team-bar{height:34px;padding:0 10px;background:var(--live-panel-2);color:var(--live-muted);font-size:10px;text-align:center}
  .data-live .team-bar .team-label{text-align:left;font-size:12px;font-weight:800;color:var(--live-text)}
  .data-live .player-row{height:45px;padding:0 10px;background:var(--live-row);border-top:1px solid var(--live-row-line);font-size:12px;text-align:center}
  .data-live .player-row.dead{opacity:.47}.data-live .player-main{display:flex;align-items:center;gap:8px;min-width:0;text-align:left}
  .data-live .player-avatar{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:0;background:#27313c;color:#d7e1eb;font-size:12px;font-weight:800;overflow:hidden;flex:0 0 28px}
  .data-live .player-avatar img{width:100%;height:100%;object-fit:cover}.data-live .player-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
  .data-live .weapon-img{display:block;max-width:46px;max-height:17px;margin:0 auto;object-fit:contain}.data-live .armor-img{width:18px;height:18px;object-fit:contain}
  .data-live .money{color:var(--live-text)}.data-live .kills,.data-live .deaths,.data-live .adr{color:var(--live-text);font-weight:700}
  .data-live .hp-wrap{display:flex;align-items:center}.data-live .hp-bar{position:relative;display:flex;align-items:center;width:56px;height:14px;border-radius:0;background:#34404b;overflow:hidden}.data-live .hp-fill{position:absolute;inset:0 auto 0 0;background:#43a91f}.data-live .hp-fill.low{background:#d59a2f}.data-live .hp-fill.crit{background:#c94747}.data-live .hp-num{position:relative;z-index:1;padding-left:4px;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.65)}
  .data-live .panel-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px;padding:0 10px;color:var(--live-muted);font-size:11px}
  .data-live .bomb{display:flex;align-items:center;gap:6px;color:#cfd7df}.data-live .bomb.active{color:#ffca62;font-weight:700}.data-live .bomb img{width:20px;height:20px;object-fit:contain}
  .data-live .radar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--live-line)}
  .data-live .radar-title{font-size:13px;font-weight:800}.data-live .radar-map{font-size:11px;color:var(--live-muted)}
  .data-live .game-log-body{display:grid;grid-template-columns:minmax(0,1fr) 320px;height:320px;background:var(--live-panel)}
  .data-live .radar{position:relative;width:320px;height:320px;background:var(--radar-bg) center/cover no-repeat;border-left:1px solid var(--live-line);overflow:hidden;background-blend-mode:luminosity}
  .data-live .radar:before{content:"";position:absolute;z-index:1;inset:0;background:rgba(4,9,14,.56)}
  .data-live .radar-image{position:absolute;z-index:2;inset:0;width:100%;height:100%;object-fit:contain;opacity:1;filter:brightness(var(--radar-brightness)) contrast(1.22)}
  .data-live #killMarkers{position:absolute;z-index:3;inset:0;pointer-events:none}
  .data-live .kill-marker{position:absolute;width:18px;height:18px;opacity:.85;transform:translate(-50%,-50%);filter:drop-shadow(0 1px 2px rgba(0,0,0,.85))}
  .data-live .kill-marker:before,.data-live .kill-marker:after{content:"";position:absolute;left:8px;top:0;width:2px;height:18px;border-radius:0;background:currentColor}
  .data-live .kill-marker:before{transform:rotate(45deg)}.data-live .kill-marker:after{transform:rotate(-45deg)}
  .data-live .kill-marker.ct{color:var(--ct)}.data-live .kill-marker.t{color:var(--t)}
  .data-live .kill-feed{min-width:0;background:var(--live-panel)}.data-live .kill-feed-list{height:100%;overflow-y:auto;padding:5px 8px 8px;scrollbar-color:#56616c var(--live-bg);scrollbar-width:thin}
  .data-live .kill-line{display:flex;align-items:center;justify-content:flex-start;gap:5px;width:max-content;max-width:100%;min-height:32px;margin-top:5px;padding:3px 7px;border:1px solid var(--live-line);border-radius:0;background:var(--live-bg);font-size:14px}
  .data-live .kill-line.round-over{border-color:var(--ct);color:var(--live-text)}.data-live .kill-line.round-over.t{border-color:var(--t)}
  .data-live .kill-line.bomb-planted{border-color:#d9a817;color:#f4cc45}.data-live .plant-icon{width:18px;height:18px;object-fit:contain}
  .data-live .round-winner.ct{color:var(--ct);font-weight:800}.data-live .round-winner.t{color:var(--t);font-weight:800}
  .data-live .kill-name{max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}.data-live .kill-name.ct{color:var(--ct)}.data-live .kill-name.t{color:var(--t)}
  .data-live .kill-assist{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}.data-live .kill-assist.ct{color:var(--ct)}.data-live .kill-assist.t{color:var(--t)}.data-live .kill-plus{color:#6f7b86}.data-live .kill-weapon{display:flex;align-items:center;justify-content:center;width:46px;height:20px;flex:0 0 46px}.data-live .kill-weapon .weapon-img{max-width:44px;max-height:19px}.data-live .kill-headshot{width:18px;height:18px;object-fit:contain}.data-live .kill-victim{margin-left:0}.data-live .kill-round{color:#76828d;font-size:11px;white-space:nowrap}
  @media(max-width:980px){.data-live .game-log-body{grid-template-columns:minmax(0,1fr) 280px;height:280px}.data-live .radar{width:280px;height:280px}}
  @media(max-width:680px){.data-live{padding:8px}.data-live .score-top{padding:0 9px;min-height:64px}.data-live .score-center{padding:0 8px}.data-live .score{font-size:29px}.data-live .team-name{font-size:13px}.data-live .team-bar,.data-live .player-row{grid-template-columns:minmax(92px,1fr) 42px 54px 45px 26px 26px 36px}.data-live .team-bar span:nth-child(3),.data-live .player-row>*:nth-child(3){display:none}.data-live .team-bar span:nth-child(5),.data-live .player-row>*:nth-child(5){display:none}.data-live .team-bar span:nth-child(8),.data-live .player-row>*:nth-child(8){display:none}.data-live .player-row{height:42px;padding:0 7px;column-gap:3px}.data-live .team-bar{padding:0 7px;column-gap:3px}.data-live .player-avatar{width:24px;height:24px;flex-basis:24px}.data-live .hp-bar{width:28px}.data-live .money{font-size:10px}.data-live .game-log-body{display:flex;height:auto;flex-direction:column}.data-live .radar{order:1;width:100%;height:auto;aspect-ratio:1/1;border-left:0;border-bottom:1px solid var(--live-line)}.data-live .kill-feed{order:2}.data-live .kill-feed-list{height:190px}}
</style>
<div class="data-live" id="data-live">
  <div class="live-heading">
    <h2>比赛数据直播</h2>
    <span class="source-badge" id="sourceBadge">等待观战账号连接</span>
  </div>
  <div class="live-grid">
    <section class="scoreboard">
      <header class="score-top">
        <div class="score-side"><span class="side-tag ct">CT</span><span class="team-name" id="team1Name">{{ match.team1_name or 'CT' }}</span></div>
        <div class="score-center">
          <div class="score"><span id="liveScore1">0</span> : <span id="liveScore2">0</span></div>
          <div class="match-meta">R<span id="roundNum">-</span> <span id="mapName">-</span> <span class="timer" id="timer">-</span></div>
        </div>
        <div class="score-side right"><span class="team-name" id="team2Name">{{ match.team2_name or 'T' }}</span><span class="side-tag t">T</span></div>
      </header>
      <div class="team-block">
        <div class="team-bar"><span class="team-label">CT 选手</span><span>手枪</span><span>主武器</span><span>血量</span><span>护甲</span><span>金钱</span><span>K</span><span>A</span><span>D</span><span>ADR</span></div>
        <div id="team1Players"></div>
      </div>
      <div class="round-strip" id="roundStrip"><span class="round-empty">等待回合数据</span></div>
      <div class="team-block">
        <div class="team-bar"><span class="team-label">T 选手</span><span>手枪</span><span>主武器</span><span>血量</span><span>护甲</span><span>金钱</span><span>K</span><span>A</span><span>D</span><span>ADR</span></div>
        <div id="team2Players"></div>
      </div>
      <footer class="panel-footer">
        <span id="updatedAt">尚未收到数据</span>
        <span class="bomb" id="bombState"><img loading="lazy" src="/resources/icons/match/bomb.webp" alt="">炸弹状态：-</span>
      </footer>
    </section>
    <aside class="radar-panel">
      <div class="radar-head"><span class="radar-title">比赛日志</span><span class="radar-map" id="radarMap">-</span></div>
      <div class="game-log-body">
        <div class="kill-feed">
          <div class="kill-feed-list" id="killFeed"><div class="kill-line"><span class="victim">等待数据</span></div></div>
        </div>
        <div class="radar" id="radar">
          <img loading="lazy" class="radar-image" id="radarImage" src="/resources/radars/mirage.svg" alt="">
          <div id="killMarkers"></div>
        </div>
      </div>
    </aside>
  </div>
</div>
<script>
const MATCH_ID = {{ match.id }};
const ICON_BASE = '/resources/icons/match/';
const SUPPORTED_MAPS = new Set(['dust2','mirage','inferno','nuke','overpass','ancient','anubis','vertigo','train','cache']);
const MAP_OVERVIEWS = {
  dust2:{x:-2476,y:3239,scale:4.4},mirage:{x:-3230,y:1713,scale:5},
  inferno:{x:-2087,y:3870,scale:4.9},nuke:{x:-3453,y:2887,scale:7},
  overpass:{x:-4831,y:1781,scale:5.2},vertigo:{x:-3168,y:1762,scale:4},
  cache:{x:-2000,y:3250,scale:5.5},train:{x:-2477,y:2392,scale:4.7}
};
const MAP_BOUNDS = {
  ancient:{x0:-3200,y0:-3800,x1:4200,y1:3700},
  anubis:{x0:-2900,y0:-2500,x1:3200,y1:3200}
};
const WEAPON_ICONS = {
  ak47:'ak47',awp:'awp',m4a1:'m4a1',m4a1silencer:'m4a1_silencer',deagle:'deagle',
  uspsilencer:'usp_silencer',glock:'glock',famas:'famas',galilar:'galilar',
  p250:'p250',mp9:'mp9',elite:'elite',hkp2000:'hkp2000'
};
function escapeHtml(value){const div=document.createElement('div');div.textContent=String(value??'');return div.innerHTML}
function escapeAttr(value){return escapeHtml(value).replace(/"/g,'&quot;')}
function mapKey(name){return String(name||'').toLowerCase().replace('de_','').replace(/[^a-z0-9]/g,'')}
function mapDisplay(name){return String(name||'').replace(/^(de_|cs_)/i,'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function weaponIcon(name){
  if(!name||name==='-')return '';
  const key=String(name).toLowerCase().replace('weapon_','').replace(/[^a-z0-9]/g,'');
  const icon=WEAPON_ICONS[key]||key;
  return `<img loading="lazy" class="weapon-img" src="${ICON_BASE}${icon}.${icon==='hkp2000'?'png':'webp'}" onerror="this.style.display='none'" alt="">`;
}
function armorIcon(armor,helmet){
  if(helmet)return '<img loading="lazy" class="armor-img" src="/resources/icons/match/kevlar_helmet.webp" alt="">';
  if(Number(armor)>0)return '<img loading="lazy" class="armor-img" src="/resources/icons/match/kevlar.webp" alt="">';
  return '-';
}
function avatar(player){
  if(player.avatar)return `<span class="player-avatar"><img loading="lazy" src="${escapeAttr(player.avatar)}" onerror="this.parentElement.textContent='${escapeAttr((player.name||'?')[0])}'" alt=""></span>`;
  return `<span class="player-avatar">${escapeHtml((player.name||'?')[0])}</span>`;
}
function renderTeam(target,players){
  const rows=[...(players||[])];
  while(rows.length<5)rows.push(null);
  document.getElementById(target).innerHTML=rows.slice(0,5).map(player=>{
    if(!player)return '<div class="player-row dead"><span class="player-main"><span class="player-avatar">-</span><span class="player-name">-</span></span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span></div>';
    const hp=Number(player.hp),hpKnown=Number.isFinite(hp),hpClass=hp>60?'':(hp>30?' low':' crit');
    return `<div class="player-row${player.alive===false?' dead':''}">
      <span class="player-main">${avatar(player)}<span class="player-name" title="${escapeAttr(player.name)}">${escapeHtml(player.name||'-')}</span></span>
      <span>${weaponIcon(player.secondary)}</span><span>${weaponIcon(player.primary)}</span>
      <span class="hp-wrap">${hpKnown?`<span class="hp-bar"><span class="hp-fill${hpClass}" style="width:${Math.max(0,Math.min(100,hp))}%"></span><span class="hp-num">${hp}</span></span>`:'-'}</span>
      <span>${armorIcon(player.armor,player.helmet)}</span><span class="money">${player.money==='-'?'-':'$'+Number(player.money||0)}</span>
      <span class="kills">${Number(player.kills||0)}</span><span>${Number(player.assists||0)}</span><span class="deaths">${Number(player.deaths||0)}</span><span class="adr">${Number(player.adr||0)}</span>
    </div>`;
  }).join('');
}
function radarPoint(x,y,mapName){
  const key=mapKey(mapName),overview=MAP_OVERVIEWS[key];
  if(overview){
    return {left:Math.max(2,Math.min(98,(Number(x)-overview.x)/(overview.scale*1024)*100)),top:Math.max(2,Math.min(98,(overview.y-Number(y))/(overview.scale*1024)*100))};
  }
  const bounds=MAP_BOUNDS[key]||{x0:-3200,y0:-3200,x1:3200,y1:3200};
  return {left:Math.max(2,Math.min(98,(Number(x)-bounds.x0)/(bounds.x1-bounds.x0)*100)),top:Math.max(2,Math.min(98,100-(Number(y)-bounds.y0)/(bounds.y1-bounds.y0)*100))};
}
function renderRadarMap(mapName){
  const requested=mapKey(mapName),key=SUPPORTED_MAPS.has(requested)?requested:'mirage';
  document.getElementById('radar').style.backgroundImage=`url("/resources/map_landscapes/${encodeURIComponent(key)}.png")`;
  document.getElementById('radarImage').src=`/resources/radars/${encodeURIComponent(key)}.svg`;
}
function renderKills(data){
  const all=[...(data.kill_markers||[])],round=Number(data.round||0);
  const current=all.filter(k=>Number(k.round)===round).slice(-10);
  document.getElementById('killMarkers').innerHTML=current.map(k=>{
    const p=radarPoint(k.x,k.y,data.map_name),side=String(k.side||'').toLowerCase()==='ct'?'ct':'t';
    return `<span class="kill-marker ${side}" style="left:${p.left}%;top:${p.top}%" title="${escapeAttr(k.name||'未知选手')}"></span>`;
  }).join('');
  const inferred=current.map(k=>({round:k.round,victim:k.name,victim_side:k.side}));
  const latestKills=[...(data.kill_events&&data.kill_events.length?data.kill_events:inferred)].filter(k=>Number(k.round)===round).slice(-10);
  const latestPlants=[...(data.bomb_events||[])].filter(k=>Number(k.round)===round).slice(-4);
  const history=[...(data.round_history||[])];
  const latestRound=history.length?history[history.length-1]:null;
  const score=history.reduce((total,item)=>{
    const side=String(item.side||item.winner||'').toLowerCase();
    if(side==='ct'||side==='t1')total.ct+=1;
    if(side==='t'||side==='t2')total.t+=1;
    return total;
  },{ct:0,t:0});
  const completedSide=String(latestRound?.side||latestRound?.winner||'').toLowerCase();
  const winnerSide=completedSide==='ct'||completedSide==='t1'?'ct':(completedSide==='t'||completedSide==='t2'?'t':'');
  const roundScore={
    ct:Number.isFinite(Number(latestRound?.score_ct))?Number(latestRound.score_ct):score.ct,
    t:Number.isFinite(Number(latestRound?.score_t))?Number(latestRound.score_t):score.t
  };
  const currentEvents=[
    ...latestKills.map((event,index)=>({...event,type:'kill',order:Number(event.captured_at_epoch)||index})),
    ...latestPlants.map((event,index)=>({...event,type:'plant',order:Number(event.captured_at_epoch)||latestKills.length+index}))
  ].sort((a,b)=>b.order-a.order).slice(0,10);
  const killLines=currentEvents.map(k=>{
    if(k.type==='plant')return `<div class="kill-line bomb-planted">
      <span class="kill-name t">${escapeHtml(k.player||'T Player')}</span>
      <img loading="lazy" class="plant-icon" src="/resources/icons/match/bombplant.webp" alt="">
      <span>planted the bomb on ${escapeHtml(k.site||'?')} (${Number(k.alive_t||0)}on${Number(k.alive_ct||0)})</span>
    </div>`;
    const killerSide=String(k.killer_side||'').toLowerCase()==='ct'?'ct':'t',assisterSide=String(k.assister_side||k.killer_side||'').toLowerCase()==='ct'?'ct':'t',victimSide=String(k.victim_side||'').toLowerCase()==='ct'?'ct':'t';
    return `<div class="kill-line">
      <span class="kill-name ${killerSide}">${escapeHtml(k.killer||'-')}</span>
      ${k.assister?`<span class="kill-plus">+</span><span class="kill-assist ${assisterSide}">${escapeHtml(k.assister)}</span>`:''}
      <span class="kill-weapon">${weaponIcon(k.weapon)}</span>
      ${k.headshot?'<img loading="lazy" class="kill-headshot" src="/resources/icons/match/headshot.webp" alt="">':''}
      <span class="kill-name kill-victim ${victimSide}">${escapeHtml(k.victim||'未知选手')}</span>
      <span class="kill-round">R${Number(k.round||0)}</span>
    </div>`;
  });
  if(latestRound&&winnerSide)killLines.push(`<div class="kill-line round-over ${winnerSide}"><span>Round over - Winner:</span><span class="round-winner ${winnerSide}">${winnerSide.toUpperCase()}</span><span>(${roundScore.ct} - ${roundScore.t}) - ${escapeHtml(latestRound.reason||'Round completed')}</span></div>`);
  document.getElementById('killFeed').innerHTML=killLines.length?killLines.join(''):'<div class="kill-line"><span class="kill-round">本回合尚无击杀</span></div>';
}
function renderRounds(rounds){
  const el=document.getElementById('roundStrip');
  el.innerHTML=rounds&&rounds.length?rounds.map(r=>`<img loading="lazy" class="round-result" src="${ICON_BASE}${r.winner==='t1'?'ct_win.svg':'t_win.svg'}" alt="">`).join(''):'<span class="round-empty">等待回合数据</span>';
}
function bombIcon(bomb){
  const state=String(bomb?.state||'');
  if(state==='exploded')return ICON_BASE+'bomb_exploded.svg';
  if(state==='defused')return ICON_BASE+'bomb_defused.svg';
  if(state==='planted'||state==='planting')return ICON_BASE+'bombplant.webp';
  return ICON_BASE+'bomb.webp';
}
function bombLabel(bomb){
  const states={planted:'已安放',carried:'携带中',dropped:'已掉落',defused:'已拆除',exploded:'已爆炸',planting:'正在安放',defusing:'正在拆除'};
  if(!bomb||!bomb.state)return '炸弹状态：-';
  const seconds=Number(bomb.countdown);
  return '炸弹状态：'+(states[bomb.state]||bomb.state)+(Number.isFinite(seconds)?` ${seconds.toFixed(1)}s`:'');
}
function formatUpdatedAt(value){
  if(!value)return '尚未收到数据';
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return '更新：'+String(value).replace('T',' ').slice(0,16);
  return '更新：'+date.toLocaleString('zh-CN',{hour12:false,year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function render(data){
  const sourceText={gsi:'观战账号已连接',gotv:'GOTV 数据已连接',a2s:'比赛服务器已连接，等待观战账号',stale_gsi:'观战账号连接已中断'};
  document.getElementById('sourceBadge').textContent=sourceText[data.source]||'等待观战账号连接';
  document.getElementById('sourceBadge').classList.toggle('online',data.source==='gsi'||data.source==='gotv'||data.source==='a2s');
  document.getElementById('liveScore1').textContent=data.team1?.score??0;document.getElementById('liveScore2').textContent=data.team2?.score??0;
  document.getElementById('team1Name').textContent=data.team1?.name||'CT';document.getElementById('team2Name').textContent=data.team2?.name||'T';
  document.getElementById('roundNum').textContent=data.round??'-';document.getElementById('mapName').textContent=mapDisplay(data.map_name)||'-';document.getElementById('timer').textContent=data.timer||'-';
  document.getElementById('radarMap').textContent=mapDisplay(data.map_name)||'-';document.getElementById('updatedAt').textContent=formatUpdatedAt(data.updated_at);
  const bomb=document.getElementById('bombState');bomb.innerHTML=`<img loading="lazy" src="${bombIcon(data.bomb)}" alt="">`+escapeHtml(bombLabel(data.bomb));bomb.classList.toggle('active',Boolean(data.bomb?.state));
  renderTeam('team1Players',data.players_t1);renderTeam('team2Players',data.players_t2);renderRounds(data.round_history);renderRadarMap(data.map_name);renderKills(data);
}
async function fetchLive(){
  try{const response=await fetch(`/api/live/${MATCH_ID}`);const data=await response.json();if(data.ok)render(data)}
  catch(error){console.error('Live fetch error:',error)}
}
fetchLive();setInterval(fetchLive,1000);
</script>
