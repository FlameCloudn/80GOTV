{#
  全站设计变量（颜色 / 字号 / 间距 / 圆角）——前台唯一来源。

  所有前台页面（包括登录、战报这类不继承 base.html 的独立页面）都引入这个文件。
  直接写在页面里（不是外部文件），浏览器一打开就有颜色，不会先白一下。

  配色原则（第三版前台）：
  - 平实：中性灰底 + 一个沉稳的蓝色做强调；胜负、阵营、荣誉用低饱和的语义色。
  - 不新增零散颜色：样式里只用这里的变量；需要浅色底时用 *-soft 版本。
#}
<style id="design-tokens">
:root{
  /* 版心 */
  --max-width:1200px;        /* 普通页面 */
  --narrow-width:920px;      /* 小游戏、对比这类工具页 */
  --form-width:640px;        /* 单列表单页 */
  --side-width:300px;        /* 右侧栏 */
  --site-gap:16px;           /* 栏与栏、面板与面板之间 */
  --header-h:56px;

  /* 字体与字号 */
  --site-font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;
  --font-xs:12px;            /* 时间、角标、表头 */
  --font-sm:13px;            /* 次要文字 */
  --font-md:14px;            /* 正文 */
  --font-lg:16px;            /* 面板里的小标题 */
  --font-xl:20px;            /* 页面标题 */
  --font-2xl:26px;           /* 详情页大标题 */
  --font-3xl:34px;           /* 大比分 */

  /* 间距 */
  --space-xs:4px;
  --space-sm:8px;
  --space-md:12px;
  --space-lg:16px;
  --space-xl:20px;
  --space-2xl:24px;
  --space-3xl:32px;

  /* 形状与动效 */
  --radius-sm:4px;
  --radius-md:6px;
  --radius-lg:10px;
  --radius-pill:999px;
  --control-h:34px;          /* 按钮、输入框统一高度 */
  --row-h:40px;              /* 列表一行 */
  --transition-fast:.12s;
  --transition-base:.2s;

  --color-white:#fff;
  --color-dark:#1b1f24;
  --on-image-shadow:0 1px 3px rgba(0,0,0,.6);  /* 图片上的白字（地图条），深浅色模式都一样 */
}

/* ---------- 深色（默认） ---------- */
:root,:root[data-theme='dark']{
  color-scheme:dark;
  /* 底色 */
  --bg-primary:#121418;      /* 页面背景 */
  --bg-card:#1a1d22;         /* 面板 */
  --bg-hover:#22262c;        /* 悬停 */
  --surface-soft:#1f2328;    /* 面板里的浅色块、表头 */
  --bg-input:#15181c;        /* 输入框 */
  --nav-bg:#16191d;          /* 顶栏 */
  /* 文字 */
  --text-primary:#e7e9ec;
  --text-secondary:#b6bcc4;
  --text-muted:#8b939d;
  --text-link:#8cb4dc;
  --text-link-hover:#b0cdea;
  /* 线条 */
  --border-color:#2a2f36;
  --border-strong:#3a414a;
  /* 强调色 */
  --accent:#6b9fd1;
  --accent-hover:#86b2dc;
  --accent-soft:rgba(107,159,209,.14);
  --accent-contrast:#0f1318; /* 强调色底上的文字 */
  /* 语义色 */
  --color-green:#4cae7c;     /* 胜利、正向数据 */
  --color-red:#df6a5f;       /* 失败、负向数据、删除 */
  --color-gold:#d1a64b;      /* MVP、冠军 */
  --color-purple:#a990d9;    /* EVP、荣誉头衔 */
  --color-ct:#6aa6db;        /* CT 阵营 */
  --color-t:#dda24c;         /* T 阵营 */
  --live:#ef5b52;            /* 直播中 */
  --green-soft:rgba(76,174,124,.14);
  --red-soft:rgba(223,106,95,.14);
  --gold-soft:rgba(209,166,75,.15);
  --purple-soft:rgba(169,144,217,.15);
  --live-soft:rgba(239,91,82,.15);
  /* 阴影与遮罩 */
  --shadow:rgba(0,0,0,.35);
  --shadow-raised:0 12px 32px rgba(0,0,0,.45);
  --overlay:rgba(8,10,13,.62);
  --logo-outline:rgba(255,255,255,.22);  /* 深色队标外圈的淡亮边 */
  /* 提示条 */
  --alert-success-bg:#17301f;--alert-success-color:#86d6a4;--alert-success-border:#2b5238;
  --alert-error-bg:#351b19;--alert-error-color:#f2aaa3;--alert-error-border:#5c2f2b;
  --alert-info-bg:#172534;--alert-info-color:#9cc3e6;--alert-info-border:#2a4560;
}

/* ---------- 浅色 ---------- */
:root[data-theme='light']{
  color-scheme:light;
  --bg-primary:#f3f4f6;
  --bg-card:#ffffff;
  --bg-hover:#f2f4f7;
  --surface-soft:#f7f8fa;
  --bg-input:#ffffff;
  --nav-bg:#ffffff;
  --text-primary:#1b1f24;
  --text-secondary:#4a525c;
  --text-muted:#6b7480;
  --text-link:#2a65a0;
  --text-link-hover:#1d4f82;
  --border-color:#e3e6ea;
  --border-strong:#cbd1d8;
  --accent:#2d6aa5;
  --accent-hover:#245a8e;
  --accent-soft:rgba(45,106,165,.09);
  --accent-contrast:#ffffff;
  --color-green:#23844f;
  --color-red:#c1443a;
  --color-gold:#9c7312;
  --color-purple:#7451ad;
  --color-ct:#2f6fa3;
  --color-t:#b06d12;
  --live:#d63a30;
  --green-soft:rgba(35,132,79,.10);
  --red-soft:rgba(193,68,58,.10);
  --gold-soft:rgba(156,115,18,.11);
  --purple-soft:rgba(116,81,173,.10);
  --live-soft:rgba(214,58,48,.10);
  --shadow:rgba(16,24,40,.08);
  --shadow-raised:0 12px 32px rgba(16,24,40,.14);
  --overlay:rgba(20,24,30,.45);
  --logo-outline:transparent;
  --alert-success-bg:#e6f4ec;--alert-success-color:#185c38;--alert-success-border:#bfe0cc;
  --alert-error-bg:#fbeceb;--alert-error-color:#8a2a22;--alert-error-border:#f0c9c5;
  --alert-info-bg:#e9f1f9;--alert-info-color:#1d4f82;--alert-info-border:#c7dbef;
}

/* ---------- 旧名字（只为兼容个别还没改完的地方，全部指向上面的标准变量；新样式不要再用） ---------- */
:root{
  --panel-shadow:0 1px 2px var(--shadow);
  --color-blue:var(--accent);
  --color-win:var(--color-green);
  --color-loss:var(--color-red);
  --rating-good:var(--color-green);
  --bg-secondary:var(--surface-soft);
  --h-panel:var(--bg-card);
  --h-panel-head:var(--surface-soft);
  --h-panel-line:var(--border-color);
  --h-panel-soft:var(--surface-soft);
  --h-row:var(--bg-card);
  --h-row-alt:var(--surface-soft);
  --h-blue:var(--accent);
  --h-shadow:var(--panel-shadow);
}

/* 样式文件还没下载完时，先铺好背景色，避免白屏闪一下 */
html{background:var(--bg-primary);color:var(--text-primary)}
</style>
