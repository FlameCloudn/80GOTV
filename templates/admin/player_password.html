{% extends "admin/_layout.html" %}
{% import "admin/_icons.html" as ui %}
{% block title %}修改选手密码{% endblock %}
{% block main %}
<a href="{{ url_for('admin.admin_players') }}" class="back-link">← 返回选手管理</a>
<header class="page-head">
  <div><span class="page-head-kicker" data-i18n-ignore>PLAYERS</span><h1>修改选手密码</h1></div>
</header>

<section class="panel admin-form-narrow">
  <dl class="facts">
    <div><dt>选手</dt><dd data-i18n-ignore>{{ account.nickname }}</dd></div>
    <div><dt>网站账号</dt><dd data-i18n-ignore>{{ account.username }}</dd></div>
  </dl>
  <form method="post" class="admin-form form-section" data-busy-text="保存中……" data-guard>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="field">
      <span class="field-label">新密码</span>
      <input id="password" type="password" name="password" minlength="8" maxlength="128" autocomplete="new-password" required>
      <span class="field-hint">至少 8 位。保存后旧密码立即失效。</span>
    </label>
    <label class="field">
      <span class="field-label">再次输入新密码</span>
      <input id="password2" type="password" name="password2" minlength="8" maxlength="128" autocomplete="new-password" required>
    </label>
    <div class="form-actions">
      <a class="btn" href="{{ url_for('admin.admin_players') }}" data-discard>取消</a>
      <button class="btn btn-primary" type="submit">{{ ui.icon('key') }}保存新密码</button>
    </div>
  </form>
</section>
{% endblock %}
