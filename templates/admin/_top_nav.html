{#- 后台顶栏：左边站标 + “后台”，右边查看前台、深浅色、语言、当前账号、退出（样式同前台顶栏） -#}
{%- import "admin/_icons.html" as ui -%}
<header class="admin-topbar">
  <div class="admin-topbar-inner">
    <a class="admin-brand" href="{{ url_for('admin.admin_dashboard') }}">
      <img src="{{ url_for('static', filename='logos/80gotv-mark.png') }}" class="site-logo-mark" alt="" width="28" height="28">
      <span class="admin-brand-name" data-i18n-ignore>80GOTV</span>
      <span class="admin-brand-tag">后台管理</span>
    </a>
    <div class="admin-topbar-tools">
      <a class="btn btn-subtle btn-sm" href="/" target="_blank" rel="noopener">{{ ui.icon('external') }}查看前台</a>
      <button id="themeToggle" class="theme-btn" type="button" aria-label="切换主题" title="切换深色/浅色模式">
        <span class="theme-symbol" data-i18n-ignore aria-hidden="true">
          <svg class="theme-mode-icon theme-mode-icon-moon" viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg>
          <svg class="theme-mode-icon theme-mode-icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </span>
      </button>
      <select id="languageSelect" class="language-select" aria-label="语言">
        <option value="auto">跟随系统</option>
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
      <span class="admin-account" data-i18n-ignore>
        {{ session.admin_username }}{% if current_user_group_username %}<span class="admin-account-handle">@{{ current_user_group_username }}</span>{% endif %}
      </span>
      <a href="{{ url_for('admin.admin_logout') }}" class="btn btn-sm">{{ ui.icon('logout') }}退出</a>
    </div>
  </div>
</header>
