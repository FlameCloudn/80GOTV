{#- 后台登录：不带导航的独立页面，和前台同一套颜色与输入框 -#}
<!doctype html>
<html lang="zh-CN">
<head>
  {% include "_standalone_head.html" %}
  <title>后台管理登录 - 80GOTV</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="16x16 32x32 48x48">
  <link rel="stylesheet" href="{{ versioned_url('static/css/app.css') }}">
  <link rel="stylesheet" href="{{ versioned_url('static/css/toast.css') }}">
  <link rel="stylesheet" href="{{ versioned_url('static/css/pages/admin.css') }}">
</head>
<body class="admin-body admin-login-body">
<main class="admin-login-card">
  <div class="admin-login-brand">
    <img src="{{ url_for('static', filename='logos/80gotv-mark.png') }}" class="site-logo-mark" alt="" width="28" height="28">
    <span data-i18n-ignore>80GOTV</span>
    <span class="admin-brand-tag">后台管理</span>
  </div>
  <h1>后台管理登录</h1>

  {% include "admin/_flashes.html" %}

  <form method="post" class="form" data-busy-text="登录中……">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="field">
      <span class="field-label">用户名</span>
      <input type="text" name="username" required autofocus autocomplete="username" placeholder="请输入用户名">
    </label>
    <label class="field">
      <span class="field-label">密码</span>
      <input type="password" name="password" required autocomplete="current-password" placeholder="请输入密码">
    </label>
    <button type="submit" class="btn btn-primary btn-lg btn-block">登录</button>
  </form>

  <div class="admin-login-foot">
    <a href="/" class="back-link">← 返回前台</a>
    <select id="languageSelect" class="language-select" aria-label="语言">
      <option value="auto">跟随系统</option>
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
  </div>
</main>
<script src="{{ versioned_url('static/js/site_dialogs.js') }}"></script>
<script src="{{ versioned_url('static/js/admin.js') }}"></script>
<script src="{{ versioned_url('static/js/i18n.js') }}"></script>
</body>
</html>
