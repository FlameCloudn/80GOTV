<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>后台管理 — 80GOTV</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-comfort.css') }}">
  <script>
    (function(){
      var t = localStorage.getItem('theme');
      if(!t){ t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'; }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

<div class="admin-top-nav">
  <div class="logo">🎮 CS2 后台管理</div>
  <div class="links">
    <a href="/admin">📊 首页</a>
    <a href="/admin/teams">👥 队伍</a>
    <a href="/admin/players">🎯 选手</a>
    <a href="/admin/events">🏆 赛事</a>
    <a href="/admin/matches">⚔️ 比赛</a>
    <a href="/admin/news">📰 新闻</a>
    <span style="color:var(--text-muted);margin:0 4px">|</span>
    <span style="color:var(--text-muted)">{{ session.admin_username }}</span>
    <a href="/admin/logout" class="admin-logout-btn">退出</a>
  </div>
</div>

<div class="admin-container">
  <h2 style="margin-bottom:var(--space-xl);color:var(--text-primary)">数据统计</h2>
  <div class="admin-dash-stats">
    <div class="admin-stat-box">
      <div class="admin-stat-value">{{ stats.teams }}</div>
      <div class="admin-stat-label">队伍</div>
    </div>
    <div class="admin-stat-box">
      <div class="admin-stat-value">{{ stats.players }}</div>
      <div class="admin-stat-label">选手</div>
    </div>
    <div class="admin-stat-box">
      <div class="admin-stat-value">{{ stats.events }}</div>
      <div class="admin-stat-label">赛事</div>
    </div>
    <div class="admin-stat-box">
      <div class="admin-stat-value">{{ stats.matches }}</div>
      <div class="admin-stat-label">比赛</div>
    </div>
    <div class="admin-stat-box">
      <div class="admin-stat-value">{{ stats.news }}</div>
      <div class="admin-stat-label">新闻</div>
    </div>
  </div>

  <h2 style="margin-bottom:var(--space-xl);color:var(--text-primary)">管理功能</h2>
  <div class="admin-nav-grid">
    <a href="/admin/teams" class="admin-nav-card">
      <div class="icon">👥</div>
      <div class="title">队伍管理</div>
    </a>
    <a href="/admin/players" class="admin-nav-card">
      <div class="icon">🎯</div>
      <div class="title">选手管理</div>
    </a>
    <a href="/admin/events" class="admin-nav-card">
      <div class="icon">🏆</div>
      <div class="title">赛事管理</div>
    </a>
    <a href="/admin/matches" class="admin-nav-card">
      <div class="icon">⚔️</div>
      <div class="title">比赛管理</div>
    </a>
    <a href="/admin/news" class="admin-nav-card">
      <div class="icon">📰</div>
      <div class="title">新闻管理</div>
    </a>
    <a href="/admin/live" class="admin-nav-card">
      <div class="icon">📡</div>
      <div class="title">直播状态</div>
    </a>
    <a href="/admin/awards/poster" class="admin-nav-card">
      <div class="icon">🏅</div>
      <div class="title">MVP / EVP 数据图</div>
    </a>
    <a href="/admin/nicknames" class="admin-nav-card">
      <div class="icon">🔖</div>
      <div class="title">昵称管理</div>
    </a>
    <a href="/admin/backup/download" class="admin-nav-card">
      <div class="icon">💾</div>
      <div class="title">下载备份</div>
    </a>
    <a href="/" class="admin-nav-card" target="_blank">
      <div class="icon">🌐</div>
      <div class="title">查看前台</div>
    </a>
  </div>
</div>

<script src="{{ url_for('static', filename='js/i18n.js') }}?v=20260614-fullsite-lang2"></script>
<script src="{{ url_for('static', filename='js/svg_icons.js') }}?v=20260620-svg1"></script>
</body>
</html>
