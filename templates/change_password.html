<!doctype html>
<html lang="zh-CN">
<head>
  {% include "_standalone_head.html" %}
  <title>修改密码 - 80GOTV</title>
  <link rel="stylesheet" href="{{ versioned_url('static/css/auth.css') }}">
  <link rel="stylesheet" href="{{ versioned_url('static/css/toast.css') }}">
</head>
<body>
  <div class="page-actions">
    <button type="button" class="theme-button" id="themeButton" aria-label="切换明暗主题" title="切换明暗主题">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.4 15.1A8.5 8.5 0 0 1 8.9 3.6 8.5 8.5 0 1 0 20.4 15.1Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <select id="languageSelect" class="language-select" aria-label="语言">
      <option value="auto">跟随系统</option>
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
  </div>

  <main class="auth-shell auth-shell--single">
    <header class="auth-single-head">
      <div class="brand-top">
        <img class="brand-mark" src="{{ url_for('static', filename='logos/80gotv-mark.png') }}" alt="">
        <span data-i18n-ignore>80GOTV</span>
      </div>
      <p>通过 Steam 验证后修改密码</p>
    </header>

    <div class="auth-single-body">
      {% include "_flash_toasts.html" %}

      {% if steam_verified_id %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="form-group">
          <label class="form-label" for="verifiedSteamId">已验证的 SteamID</label>
          <input class="text-input" id="verifiedSteamId" type="text" value="{{ steam_verified_id }}" readonly>
        </div>
        <div class="form-group">
          <label class="form-label" for="newPassword">新密码</label>
          <input class="text-input" id="newPassword" type="password" name="password" required autocomplete="new-password" placeholder="至少 8 位">
        </div>
        <div class="form-group">
          <label class="form-label" for="newPassword2">确认新密码</label>
          <input class="text-input" id="newPassword2" type="password" name="password2" required autocomplete="new-password" placeholder="再次输入新密码">
        </div>
        <button type="submit" class="primary-button">修改密码</button>
      </form>
      {% else %}
      <p class="auth-note">请先前往 Steam 确认账号归属。本站不会接触你的 Steam 密码。</p>
      <a href="/auth/steam/start?purpose=recovery" class="steam-verify-btn">使用 Steam 验证身份</a>
      {% endif %}

      <a href="/login" class="back-link">← 返回登录</a>
    </div>
  </main>

  <script>
    // 右上角按钮：切换明暗主题并记住选择
    document.getElementById('themeButton').addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  </script>
  <script src="{{ versioned_url('static/js/site_dialogs.js') }}"></script>
  <script src="{{ versioned_url('static/js/i18n.js') }}"></script>
</body>
</html>
