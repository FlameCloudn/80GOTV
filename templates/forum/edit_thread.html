{% extends "base.html" %}
{% block title %}编辑帖子 - 论坛{% endblock %}
{% block head %}
<style>
.form-container{max-width:720px;margin:0 auto}
.form-card{background:var(--h-panel);border:1px solid var(--h-panel-line);border-radius:0;padding:16px}
.form-card h2{margin:0 0 var(--space-xl);font-size:20px}
.form-group{margin-bottom:var(--space-lg)}
.form-group label{display:block;margin-bottom:var(--space-sm);font-weight:600;font-size:14px}
.form-group input[type="text"],.form-group select{width:100%;padding:10px;background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border-color);border-radius:0;font-size:14px;font-family:inherit}
.form-group textarea{width:100%;resize:vertical;min-height:300px;background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border-color);border-radius:0;padding:10px;font-family:inherit;font-size:14px;line-height:1.7}
.form-hint{font-size:12px;color:var(--text-muted);margin-top:4px}
.form-actions{display:flex;gap:var(--space-md);justify-content:flex-end}
</style>
{% endblock %}
{% block main %}
<div class="form-container">
  <div class="form-card">
    <h2>编辑帖子</h2>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-group">
        <label>版块</label>
        {% set selected_category = request.form.get('category_id', thread.category_id if thread else '') %}
        <select name="category_id" required>
          {% for category in categories %}
          <option value="{{ category.id }}"{% if selected_category|string == category.id|string %} selected{% endif %}>{{ category.name }} · {{ category.description }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>标题</label>
        <input type="text" name="title" maxlength="120" value="{{ request.form.get('title', thread.title if thread else '') }}" required>
        <div class="form-hint">最多 120 字</div>
      </div>
      <div class="form-group">
        <label>内容</label>
        <textarea name="content" required>{{ request.form.get('content', thread.content if thread else '') }}</textarea>
        <div class="form-hint">最多 10000 字</div>
      </div>
      <div class="form-actions">
        <a href="{{ url_for('forum_thread', thread_id=thread.id) }}" class="btn btn-secondary">取消</a>
        <button type="submit" class="btn btn-primary">保存修改</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
