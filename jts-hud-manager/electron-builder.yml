appId: cn.80gotv.jtshudmanager
productName: JTs Hud Manager 中文版
directories:
  buildResources: resources
files:
  - '**/*'
  - '!dist/**/*'
  - '!release-cn-*/**/*'
  - '!release-80gotv-*/**/*'
  - '!release-default-live-*/**/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,knowledgebase.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - 'resources/default-hud/**/*'
  - 'resources/map-radars/**/*'
protocols:
  name: jtshudhmanager-cn
  schemes:
    - jtshudhmanager-cn
win:
  executableName: JTs Hud Manager CN
  icon: icon.ico
nsis:
  artifactName: ${name}-${version}-cn-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: JohnTimmermann
  repo: JTs-Hud-Manager
